# OpenTelV: a WireGuard tunnel for the Fire TV that works as an exit node with LAN
# access. All public internet goes through the VPN; your home network stays local, so
# the Fire TV remote app, adb and scrcpy keep reaching the TV while the tunnel is on.
# See "WireGuard config" in opentelv/README.md.
#
# Copy this to <name>.conf (the file name becomes the tunnel name, 15 characters at most),
# fill in the <...> values from your server, then: ./opentelv/wg-import.sh <name>.conf

[Interface]
PrivateKey = <the TV's private key>
Address = <the TV's tunnel address>/32
# Quad9. Public addresses, so the AllowedIPs below already send DNS through the tunnel.
DNS = 9.9.9.9, 149.112.112.112

[Peer]
PublicKey = <the server's public key>
Endpoint = <server address>:<port>
# Every public IPv4 address: 0.0.0.0/0 without the private ranges (10/8, 172.16/12,
# 192.168/16), link-local (169.254/16) and multicast and above (224/3). The 169.x and
# 172.x entries are how "all of it except the private part" is written as ranges.
#
# Private ranges that should go through the VPN are added one by one at the end: your
# VPN's own subnet first (the server and anything else inside the VPN), then any other
# remote network, e.g. ", <your VPN subnet>/24, <another remote network>/24".
# Never add 0.0.0.0/0 or your home network: either one sends the home network into the
# tunnel, and the remote app and adb lose the TV.
AllowedIPs = 0.0.0.0/5, 8.0.0.0/7, 11.0.0.0/8, 12.0.0.0/6, 16.0.0.0/4, 32.0.0.0/3, 64.0.0.0/2, 128.0.0.0/3, 160.0.0.0/5, 168.0.0.0/8, 169.0.0.0/9, 169.128.0.0/10, 169.192.0.0/11, 169.224.0.0/12, 169.240.0.0/13, 169.248.0.0/14, 169.252.0.0/15, 169.255.0.0/16, 170.0.0.0/7, 172.0.0.0/12, 172.32.0.0/11, 172.64.0.0/10, 172.128.0.0/9, 173.0.0.0/8, 174.0.0.0/7, 176.0.0.0/4, 192.0.0.0/9, 192.128.0.0/11, 192.160.0.0/13, 192.169.0.0/16, 192.170.0.0/15, 192.172.0.0/14, 192.176.0.0/12, 192.192.0.0/10, 193.0.0.0/8, 194.0.0.0/7, 196.0.0.0/6, 200.0.0.0/5, 208.0.0.0/4, <your VPN subnet>/24
PersistentKeepalive = 25
